<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация в Iskra</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #09090d; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .btn { padding: 14px 28px; background: #c6a0ff; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; display: none; margin-top: 20px; }
        h2 { text-align: center; }
        p { color: #9692a3; font-size: 14px; text-align: center; max-width: 300px; }
    </style>
</head>
<body>
    <h2>Авторизация в Iskra...</h2>
    <p>Если приложение не открылось автоматически, нажмите кнопку ниже.</p>
    <button id="authBtn" class="btn">Войти в Iskra</button>

    <script>
        // Инициализируем WebApp
        const webapp = window.Telegram.WebApp;
        webapp.ready();

        // Берем данные пользователя из Telegram
        const user = webapp.initDataUnsafe?.user;

        if (user && user.id) {
            // Формируем Deep Link для Tauri
            const redirectUrl = `iskra://auth?user_id=${user.id}&username=${encodeURIComponent(user.first_name || "User")}`;
            
            // Пытаемся редиректнуть через 500мс (чтобы Telegram успел прогрузить WebView)
            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 500);

            // Показываем кнопку на случай, если автоматический редирект заблокирован
            const btn = document.getElementById("authBtn");
            btn.style.display = "inline-block";
            btn.onclick = () => window.location.href = redirectUrl;
        } else {
            // Если открыли не через Telegram
            document.querySelector("h2").innerText = "Откройте через Telegram";
            document.querySelector("h2").style.color = "#ff5c8a";
            document.querySelector("p").innerText = "Эта страница работает только внутри Telegram Web App.";
        }
    </script>
</body>
</html>
