<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Авторизация Iskra</title>
</head>
<body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('user_id') || params.get('id') || params.get('telegram_id');
    const username = params.get('username') || params.get('first_name') || 'Telegram User';

    if (userId) {
      window.location.href = `iskra://auth?user_id=${userId}&username=${encodeURIComponent(username)}`;
    } else {
      document.body.innerHTML = 'Ошибка авторизации: не получен ID пользователя.';
    }
  </script>
</body>
</html>
