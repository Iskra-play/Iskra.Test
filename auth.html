<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация в Iskra</title>
    <style>
        body { background-color: #09090d; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; text-align: center; }
        .btn { padding: 14px 28px; background: #c6a0ff; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; display: none; margin-top: 20px; text-decoration: none; }
        h2 { margin-bottom: 10px; }
        p { color: #9692a3; font-size: 14px; max-width: 300px; line-height: 1.5; }
        #status { margin-top: 20px; font-size: 12px; color: #ff5c8a; word-break: break-all; }
    </style>
</head>
<body>
    <h2>Авторизация в Iskra...</h2>
    <p id="msg">Проверяем данные Telegram...</p>
    
    <a id="authBtn" class="btn">Войти в Iskra</a>
    
    <div id="status"></div>

    <script>
        try {
            // Telegram передает данные в хэше URL (после #)
            // Формат: #tgWebAppData=user%3D...&tgWebAppVersion=6.0...
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const tgWebAppData = params.get('tgWebAppData');

            if (tgWebAppData) {
                // Декодируем данные
                const decodedData = decodeURIComponent(tgWebAppData);
                const userParam = new URLSearchParams(decodedData).get('user');
                
                if (userParam) {
                    const user = JSON.parse(userParam);
                    const redirectUrl = `iskra://auth?user_id=${user.id}&username=${encodeURIComponent(user.first_name || "User")}`;
                    
                    document.getElementById("msg").innerText = `Привет, ${user.first_name}! Перенаправляем...`;
                    document.getElementById("status").innerText = "Ссылка: " + redirectUrl;

                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 1000);

                    const btn = document.getElementById("authBtn");
                    btn.href = redirectUrl;
                    btn.style.display = "inline-block";
                } else {
                    throw new Error("User data not found in tgWebAppData");
                }
            } else {
                // Если данных нет, возможно, страница открыта не в Telegram Web App
                // Но мы попробуем использовать window.Telegram, если он есть
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                    const user = window.Telegram.WebApp.initDataUnsafe?.user;
                    if (user && user.id) {
                        const redirectUrl = `iskra://auth?user_id=${user.id}&username=${encodeURIComponent(user.first_name || "User")}`;
                        document.getElementById("msg").innerText = `Привет, ${user.first_name}! Перенаправляем...`;
                        setTimeout(() => { window.location.href = redirectUrl; }, 1000);
                        const btn = document.getElementById("authBtn");
                        btn.href = redirectUrl;
                        btn.style.display = "inline-block";
                        return;
                    }
                }
                throw new Error("Данные Telegram не найдены. Откройте через бота.");
            }
        } catch (e) {
            document.getElementById("msg").innerText = "Ошибка авторизации.";
            document.getElementById("status").innerText = e.message;
        }
    </script>
</body>
</html>
